# Silence Template — Maintenance Window
#
# Use this template to create a silence for planned maintenance.
# Apply via Alertmanager API:
#   curl -X POST http://alertmanager:9093/api/v1/silences -d @silence.json

name: "Maintenance Window Silence"
description: "Template for silencing alerts during planned maintenance"

