version: "1.0"

# Use the free Community Edition linter instead of the paid JVM Ultimate linter
linter: jetbrains/qodana-jvm-community:2024.3

bootstrap: |
  export QODANA_TOKEN=$QODANA_TOKEN

profile:
  name: qodana.recommended

exclude:
  - name: All
    paths:
      - .venv
      - node_modules
      - .git

failThreshold: 0
