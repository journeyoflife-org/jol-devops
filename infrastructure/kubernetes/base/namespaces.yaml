# JOL Kubernetes Namespaces with GDPR Compliance Labels
apiVersion: v1
kind: Namespace
metadata:
  name: bitrix
  labels:
    name: bitrix
    gdpr-compliant: "true"
    data-classification: "contains-pii"
    jurisdiction: "eu-lithuania"
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    name: monitoring
    gdpr-compliant: "true"
    data-classification: "operational"
---
apiVersion: v1
kind: Namespace
metadata:
  name: production
  labels:
    name: production
    gdpr-compliant: "true"
    data-classification: "contains-pii"
    jurisdiction: "eu-lithuania"
---
apiVersion: v1
kind: Namespace
metadata:
  name: staging
  labels:
    name: staging
    gdpr-compliant: "true"
    data-classification: "test-data-only"
