name: Reusable Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment name for approval gate
        required: true
        type: string
      release-name:
        description: Helm release name
        required: true
        type: string
      chart-path:
        description: Path to Helm chart
        required: false
        type: string
        default: .
      namespace:
        description: Kubernetes namespace
        required: false
        type: string
        default: default
    secrets:
      KUBECONFIG_B64:
        description: Base64-encoded kubeconfig
        required: false

jobs:
  deploy:
    name: Helm Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > $HOME/.kube/config

      - name: Helm upgrade (install)
        run: |
          helm upgrade --install "${{ inputs.release-name }}" \
            "${{ inputs.chart-path }}" \
            --namespace "${{ inputs.namespace }}" \
            --wait --timeout 5m \
            --atomic

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/${{ inputs.release-name }} \
            --namespace ${{ inputs.namespace }} --timeout=120s
