name: Reusable Build

on:
  workflow_call:
    inputs:
      image-name:
        description: Docker image name (e.g. ghcr.io/journeyoflife-org/app)
        required: true
        type: string
      dockerfile:
        description: Path to Dockerfile
        required: false
        type: string
        default: Dockerfile
      context:
        description: Build context directory
        required: false
        type: string
        default: .
      tag:
        description: Image tag override
        required: false
        type: string
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ inputs.image-name }}

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ inputs.image-name }}:${{ inputs.tag || github.sha }}
            ${{ env.REGISTRY }}/${{ inputs.image-name }}:latest
          sbom: true
          provenance: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image with cosign (keyless)
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ inputs.image-name }}:${{ inputs.tag || github.sha }}"

      - name: Generate SBOM (CycloneDX)
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          outputs: |
            type=local,dest=./sbom-output
          sbom: true
